name: Augurio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: augurio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-secret
